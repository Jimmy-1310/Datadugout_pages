<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Statistics - DataDugout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">Data<span class="accent">Dugout</span></a>
      <nav>
        <a href="index.html">Leaders</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Team Batting Statistics</h1>
    <p class="page-subtitle">2025 LMB Regular Season &middot; Aggregate team batting</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="standard">Standard</button>
      <button class="tab-btn" data-tab="advanced">Advanced</button>
    </div>

    <div id="tab-standard" class="tab-content">
      <div class="card">
        <div id="team-table-standard" class="loading">Loading team stats...</div>
      </div>
    </div>
    <div id="tab-advanced" class="tab-content" style="display:none">
      <div class="card">
        <div id="team-table-advanced" class="loading">Loading team stats...</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>DataDugout &middot; LMB 2025 Season Statistics</p>
    <p>Data sourced from MLB Stats API &middot; Play-by-play analysis</p>
  </footer>

  <script src="js/shared.js"></script>
  <script>
    const TEAM_STD_COLS = [
      { key: 'G', label: 'G', fmt: fmtInt },
      { key: 'R', label: 'R', fmt: fmtInt },
      { key: 'PA', label: 'PA', fmt: fmtInt },
      { key: 'AB', label: 'AB', fmt: fmtInt },
      { key: 'H', label: 'H', fmt: fmtInt },
      { key: '2B', label: '2B', fmt: fmtInt },
      { key: '3B', label: '3B', fmt: fmtInt },
      { key: 'HR', label: 'HR', fmt: fmtInt },
      { key: 'RBI', label: 'RBI', fmt: fmtInt },
      { key: 'BB', label: 'BB', fmt: fmtInt },
      { key: 'SO', label: 'SO', fmt: fmtInt },
      { key: 'BA', label: 'BA', fmt: fmtAvg },
      { key: 'OBP', label: 'OBP', fmt: fmtAvg },
      { key: 'SLG', label: 'SLG', fmt: fmtAvg },
      { key: 'OPS', label: 'OPS', fmt: fmtAvg },
    ];

    const TEAM_ADV_COLS = [
      { key: 'G', label: 'G', fmt: fmtInt },
      { key: 'PA', label: 'PA', fmt: fmtInt },
      { key: 'wOBA', label: 'wOBA', fmt: fmtAvg },
      { key: 'ISO', label: 'ISO', fmt: fmtAvg },
      { key: 'BABIP', label: 'BABIP', fmt: fmtAvg },
      { key: 'BB%', label: 'BB%', fmt: fmtPct },
      { key: 'K%', label: 'K%', fmt: fmtPct },
      { key: 'P/PA', label: 'P/PA', fmt: (v) => v != null ? parseFloat(v).toFixed(2) : '-' },
      { key: 'RAA', label: 'RAA', fmt: fmtDec1 },
    ];

    function renderTeamTable(containerId, data, cols) {
      const container = document.getElementById(containerId);
      let sortCol = null;
      let sortDir = 'desc';

      function render(sorted) {
        let html = '<div class="table-wrapper"><table class="stat-table"><thead><tr>';
        html += '<th class="col-rank">#</th>';
        html += '<th class="col-name">Team</th>';
        for (const col of cols) {
          const cls = sortCol === col.key ? (sortDir === 'asc' ? 'sort-asc' : 'sort-desc') : '';
          html += `<th data-col="${col.key}" class="${cls}">${col.label}</th>`;
        }
        html += '</tr></thead><tbody>';

        for (let i = 0; i < sorted.length; i++) {
          const t = sorted[i];
          html += `<tr>`;
          html += `<td class="col-rank">${i + 1}</td>`;
          html += `<td class="col-name">${t.name}</td>`;
          for (const col of cols) {
            html += `<td>${col.fmt(t[col.key])}</td>`;
          }
          html += '</tr>';
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;

        container.querySelectorAll('th[data-col]').forEach(th => {
          th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (sortCol === col) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
            else { sortCol = col; sortDir = 'desc'; }
            const s = [...sorted].sort((a, b) => {
              const va = parseFloat(a[col]) || 0;
              const vb = parseFloat(b[col]) || 0;
              return sortDir === 'desc' ? vb - va : va - vb;
            });
            render(s);
          });
        });
      }

      render(data);
    }

    async function init() {
      const teams = await loadJSON('teams.json');
      renderTeamTable('team-table-standard', teams, TEAM_STD_COLS);
      renderTeamTable('team-table-advanced', teams, TEAM_ADV_COLS);

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).style.display = '';
        });
      });
    }
    init();
  </script>
</body>
</html>
