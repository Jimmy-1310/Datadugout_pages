<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile - DataDugout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">Data<span class="accent">Dugout</span></a>
      <nav>
        <a href="index.html">Leaders</a>
        <a href="teams.html">Teams</a>
        <a href="players.html">Players</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="player-content" class="loading">Loading player...</div>
  </main>

  <footer class="site-footer">
    <p>DataDugout &middot; LMB 2025 Season Statistics</p>
    <p>Data sourced from MLB Stats API &middot; Play-by-play analysis</p>
  </footer>

  <script src="js/shared.js"></script>
  <script>
    async function init() {
      const playerId = getParam('id');
      if (!playerId) {
        document.getElementById('player-content').innerHTML = '<p>No player specified. <a href="players.html">Browse players</a></p>';
        return;
      }

      const [players, splits] = await Promise.all([
        loadJSON('players.json'),
        loadJSON('player_splits.json')
      ]);

      const player = players.find(p => String(p.id) === String(playerId));
      if (!player) {
        document.getElementById('player-content').innerHTML = '<p>Player not found. <a href="players.html">Browse players</a></p>';
        return;
      }

      const playerSplits = splits[playerId] || { vsTeam: {}, vsHand: {} };
      const qualified = player.PA >= 36;

      document.title = `${player.name} - DataDugout`;

      let html = '';

      // ── Player Header ──
      html += `<div class="player-header">
        <div class="player-name">${player.name}</div>
        <div class="player-team-info">${player.team}
          <span class="badge ${qualified ? 'badge-qualified' : 'badge-partial'}" style="margin-left:0.5rem">
            ${qualified ? 'Qualified' : 'Under 36 PA'}
          </span>
        </div>
        <div class="player-headline-stats">
          <div class="headline-stat"><div class="headline-stat-value">${player.PA}</div><div class="headline-stat-label">PA</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${fmtAvg(player.BA)}</div><div class="headline-stat-label">AVG</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${fmtAvg(player.OBP)}</div><div class="headline-stat-label">OBP</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${fmtAvg(player.SLG)}</div><div class="headline-stat-label">SLG</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${fmtAvg(player.OPS)}</div><div class="headline-stat-label">OPS</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${player.HR}</div><div class="headline-stat-label">HR</div></div>
          <div class="headline-stat"><div class="headline-stat-value">${player.RBI}</div><div class="headline-stat-label">RBI</div></div>
          ${qualified && player.wOBA !== undefined ? `<div class="headline-stat"><div class="headline-stat-value">${fmtAvg(player.wOBA)}</div><div class="headline-stat-label">wOBA</div></div>` : ''}
          ${qualified && player.RAA !== undefined ? `<div class="headline-stat"><div class="headline-stat-value">${fmtDec1(player.RAA)}</div><div class="headline-stat-label">RAA</div></div>` : ''}
        </div>
      </div>`;

      // ── Season Stats ──
      html += `<div class="card">
        <div class="card-header">Season Stats - Standard</div>
        <div id="season-standard"></div>
      </div>`;

      if (qualified) {
        html += `<div class="card">
          <div class="card-header">Season Stats - Advanced</div>
          <div id="season-advanced"></div>
        </div>`;
      }

      // ── Splits: vs Pitcher Hand ──
      html += `<div class="card">
        <div class="card-header">Splits vs Pitcher Handedness</div>
        <div id="splits-hand"></div>
      </div>`;

      // ── Splits: vs Opponent Team ──
      html += `<div class="card">
        <div class="card-header">
          <span>Splits vs Opponent Team</span>
        </span></div>
        <div class="splits-filters" style="padding: 0.75rem 1rem 0;">
          <select id="opp-team-filter" class="filter-select" style="min-width:200px">
            <option value="">All Opponents</option>
          </select>
        </div>
        <div id="splits-team"></div>
      </div>`;

      // ── Back link ──
      html += `<div style="margin-top:1rem"><a href="players.html" style="color:var(--primary);font-size:0.9rem">&larr; Back to all players</a></div>`;

      document.getElementById('player-content').innerHTML = html;

      // ── Render season stats tables ──
      const seasonStdCols = [
        { key: 'PA', label: 'PA', fmt: fmtInt },
        { key: 'AB', label: 'AB', fmt: fmtInt },
        { key: 'H', label: 'H', fmt: fmtInt },
        { key: '1B', label: '1B', fmt: fmtInt },
        { key: '2B', label: '2B', fmt: fmtInt },
        { key: '3B', label: '3B', fmt: fmtInt },
        { key: 'HR', label: 'HR', fmt: fmtInt },
        { key: 'RBI', label: 'RBI', fmt: fmtInt },
        { key: 'BB', label: 'BB', fmt: fmtInt },
        { key: 'HBP', label: 'HBP', fmt: fmtInt },
        { key: 'SO', label: 'SO', fmt: fmtInt },
        { key: 'SF', label: 'SF', fmt: fmtInt },
        { key: 'BA', label: 'BA', fmt: fmtAvg },
        { key: 'OBP', label: 'OBP', fmt: fmtAvg },
        { key: 'SLG', label: 'SLG', fmt: fmtAvg },
        { key: 'OPS', label: 'OPS', fmt: fmtAvg },
      ];
      renderSingleRowTable('season-standard', player, seasonStdCols);

      if (qualified) {
        const seasonAdvCols = [
          { key: 'PA', label: 'PA', fmt: fmtInt },
          { key: 'wOBA', label: 'wOBA', fmt: fmtAvg },
          { key: 'ISO', label: 'ISO', fmt: fmtAvg },
          { key: 'BABIP', label: 'BABIP', fmt: fmtAvg },
          { key: 'BB%', label: 'BB%', fmt: fmtPct },
          { key: 'K%', label: 'K%', fmt: fmtPct },
          { key: 'P/PA', label: 'P/PA', fmt: (v) => v != null ? parseFloat(v).toFixed(2) : '-' },
          { key: 'TB', label: 'TB', fmt: fmtInt },
          { key: 'RAA', label: 'RAA', fmt: fmtDec1 },
        ];
        renderSingleRowTable('season-advanced', player, seasonAdvCols);
      }

      // ── Render hand splits ──
      const handData = [];
      for (const [hand, stats] of Object.entries(playerSplits.vsHand)) {
        handData.push({ name: hand, ...stats });
      }
      const splitCols = getSplitCols(qualified);
      renderSplitTable('splits-hand', handData, splitCols, 'Split');

      // ── Render team splits ──
      const teamData = [];
      for (const [team, stats] of Object.entries(playerSplits.vsTeam)) {
        teamData.push({ name: team, abbr: stats.abbr, ...stats });
      }
      teamData.sort((a, b) => b.PA - a.PA);

      // Populate opponent filter
      const oppFilter = document.getElementById('opp-team-filter');
      for (const t of teamData) {
        const opt = document.createElement('option');
        opt.value = t.name;
        opt.textContent = `${t.name} (${t.PA} PA)`;
        oppFilter.appendChild(opt);
      }

      function renderTeamSplits() {
        const filterVal = oppFilter.value;
        const filtered = filterVal ? teamData.filter(t => t.name === filterVal) : teamData;
        renderSplitTable('splits-team', filtered, splitCols, 'Opponent');
      }

      renderTeamSplits();
      oppFilter.addEventListener('change', renderTeamSplits);
    }

    function getSplitCols(qualified) {
      const cols = [
        { key: 'PA', label: 'PA', fmt: fmtInt },
        { key: 'AB', label: 'AB', fmt: fmtInt },
        { key: 'H', label: 'H', fmt: fmtInt },
        { key: '2B', label: '2B', fmt: fmtInt },
        { key: '3B', label: '3B', fmt: fmtInt },
        { key: 'HR', label: 'HR', fmt: fmtInt },
        { key: 'RBI', label: 'RBI', fmt: fmtInt },
        { key: 'BB', label: 'BB', fmt: fmtInt },
        { key: 'SO', label: 'SO', fmt: fmtInt },
        { key: 'BA', label: 'BA', fmt: fmtAvg },
        { key: 'OBP', label: 'OBP', fmt: fmtAvg },
        { key: 'SLG', label: 'SLG', fmt: fmtAvg },
        { key: 'OPS', label: 'OPS', fmt: fmtAvg },
      ];
      if (qualified) {
        cols.push(
          { key: 'wOBA', label: 'wOBA', fmt: fmtAvg },
          { key: 'ISO', label: 'ISO', fmt: fmtAvg },
          { key: 'BABIP', label: 'BABIP', fmt: fmtAvg },
        );
      }
      return cols;
    }

    function renderSingleRowTable(containerId, data, cols) {
      const container = document.getElementById(containerId);
      if (!container) return;
      let html = '<div class="table-wrapper"><table class="stat-table"><thead><tr>';
      for (const col of cols) {
        html += `<th>${col.label}</th>`;
      }
      html += '</tr></thead><tbody><tr>';
      for (const col of cols) {
        html += `<td>${col.fmt(data[col.key])}</td>`;
      }
      html += '</tr></tbody></table></div>';
      container.innerHTML = html;
    }

    function renderSplitTable(containerId, data, cols, labelHeader) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (data.length === 0) {
        container.innerHTML = '<div style="padding:1rem;color:var(--text-muted);font-size:0.85rem">No data available</div>';
        return;
      }

      let html = '<div class="table-wrapper"><table class="stat-table"><thead><tr>';
      html += `<th class="col-name">${labelHeader}</th>`;
      for (const col of cols) {
        html += `<th>${col.label}</th>`;
      }
      html += '</tr></thead><tbody>';

      for (const row of data) {
        html += '<tr>';
        html += `<td class="col-name">${row.abbr || row.name}</td>`;
        for (const col of cols) {
          html += `<td>${col.fmt(row[col.key])}</td>`;
        }
        html += '</tr>';
      }

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    init();
  </script>
</body>
</html>
